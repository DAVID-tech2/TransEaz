<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#059669" />
  <title>You Are Offline — TransEaz</title>
  <link rel="icon" type="image/png" href="./assets/icons/favicon.png" />
  <style>
    :root {
      --emerald: #059669;
      --emerald-dark: #047857;
      --navy: #0f172a;
      --slate: #475569;
      --border: #e2e8f0;
      --bg: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--navy);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }
    .offline-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 440px;
      width: 100%;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
    }
    .offline-logo {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      margin: 0 auto 20px;
      display: block;
      object-fit: cover;
    }
    h1 {
      font-size: 1.375rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--navy);
    }
    p {
      font-size: 0.95rem;
      color: var(--slate);
      margin-bottom: 16px;
    }
    .offline-note {
      background: #f1f5f9;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.85rem;
      color: var(--navy);
      text-align: left;
      margin-bottom: 24px;
    }
    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: var(--emerald);
      color: #ffffff;
    }
    .btn-primary:hover {
      background: var(--emerald-dark);
    }
    .btn-secondary {
      background: #ffffff;
      color: var(--navy);
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <main class="offline-card">
    <img src="./assets/icons/icon-192.png" alt="TransEaz" class="offline-logo" />
    <h1>No Internet Connection</h1>
    <p>
      TransEaz needs an active mobile data or Wi-Fi connection to load fresh pages and open WhatsApp to send your orders or requests.
    </p>
    <div class="offline-note">
      <strong>Good to know:</strong> Any items already in your cart or local request history remain saved on this device until you reconnect.
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" type="button" onclick="window.location.reload()">Try Again</button>
      <a class="btn btn-secondary" href="./index.html">Return to Cached Home</a>
    </div>
  </main>
</body>
</html>
